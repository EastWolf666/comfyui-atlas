name: Update workflow data

# 每天凌晨 3:10 (UTC) 增量拉取一次工作流数据并自动提交。
# cron: '10 3 * * *' → 每天的 03:10 UTC
# 说明：GitHub Actions 的 cron 用 UTC，北京时间 = UTC+8 → 约上午 11:10 触发。
on:
  workflow_dispatch: # 允许手动触发
    inputs:
      pages:
        description: '扫描最新页数（每页 50 条）'
        required: false
        default: '5'
      backfill_from:
        description: '深页回补起始页（0 = 不回补）。用于捞回平台批量上架时落在中段深页的漏采条目'
        required: false
        default: '610'
      backfill_pages:
        description: '深页回补页数（从起始页起算）'
        required: false
        default: '90'
      thumb_limit:
        description: '本次最多为多少条视频工作流抽预览图（0 = 不抽）'
        required: false
        default: '300'

permissions:
  contents: write # 需要提交数据
  pages: write
  id-token: write

concurrency:
  group: update-workflows
  cancel-in-progress: false

jobs:
  update:
    outputs:
      CHANGED: ${{ steps.commit.outputs.CHANGED }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 直接检出 main 分支（而非 detached HEAD），便于后续直接 commit + push
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up ffmpeg
        # 视频封面需要本地抽帧（图片 CDN 未启用视频处理，七牛无法代劳）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Incremental scrape + rebuild shards
        env:
          # schedule 事件下 github.event.inputs 为 null，此处已做兜底
          PAGES: ${{ inputs.pages || '5' }}
          BF_FROM: ${{ inputs.backfill_from || '610' }}
          BF_PAGES: ${{ inputs.backfill_pages || '90' }}
        run: |
          echo "▶ 扫描最新 $PAGES 页（每页 50 条）…"
          # 深页回补：正常增量只覆盖最新页，而平台"短时间批量上架"的条目
          # 会整体落在中段深页（实测第 613/617/646 页各漏一批），
          # 定期回补中段可将这些条目捞回。
          if [ "$BF_PAGES" != "0" ] && [ -n "$BF_FROM" ] && [ "$BF_FROM" != "0" ]; then
            echo "▶ 深页回补第 $BF_FROM – $((BF_FROM + BF_PAGES - 1)) 页…"
          fi
          python3 scripts/update_workflows.py \
            --pages "$PAGES" \
            --backfill-from "$BF_FROM" \
            --backfill-pages "$BF_PAGES"

      - name: Extract video thumbnails
        env:
          # 每次只为新增/靠前的视频补抽有限数量，避免 CI 时长失控；
          # 已存在的缩略图会跳过，所以重复执行是幂等的
          THUMB_LIMIT: ${{ inputs.thumb_limit || '300' }}
        run: |
          if [ "$THUMB_LIMIT" = "0" ]; then
            echo "⏭  已禁用抽帧（thumb_limit=0）"
          else
            echo "▶ 为最多 $THUMB_LIMIT 条视频工作流抽取预览图…"
            python3 scripts/extract_video_thumbs.py --limit "$THUMB_LIMIT" --workers 8
          fi

      - name: Show data summary
        run: |
          python3 - <<'PY'
          import json, os, glob
          m = json.load(open("data/wf-manifest.json", encoding="utf-8"))
          total = m.get("platformTotal") or 0
          pct = f"{100*m['count']/total:.1f}%" if total else "?"
          size = os.path.getsize("data/wf-manifest.json.gz")/1024
          thumbs = glob.glob("data/thumbs/*.jpg")
          tsize = sum(os.path.getsize(p) for p in thumbs)/1048576
          print(f"条目: {m['count']} / 平台 {total}（{pct}）")
          print(f"分片: {len(m['shards'])} 片，清单 gzip {size:.0f} KB")
          print(f"视频缩略图: {len(thumbs)} 张 / {tsize:.1f} MB")
          print(f"更新: {m.get('updatedAt')}")
          PY

      - name: Commit if changed
        id: commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/
          if git diff --staged --quiet; then
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
            echo "✓ 数据无变化（未抓取到新工作流），跳过提交"
          else
            CNT=$(git diff --staged --numstat | wc -l)
            MSG="data: 定时增量更新工作流数据（$(date -u +'%Y-%m-%d')）"
            echo "▶ 提交 $CNT 个文件：$MSG"
            git commit -m "$MSG"
            git push origin main
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
            echo "COMMIT_MSG=$MSG" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### 定时增量更新"
            echo ""
            echo "- 时间: $(date -u +'%Y-%m-%d %H:%M UTC')（北京时间 +8）"
            if [ "${{ steps.commit.outputs.CHANGED }}" = "true" ]; then
              echo "- 结果: 已更新并提交 → ${{ steps.commit.outputs.COMMIT_MSG }}"
              echo "- 提交: \`$(git log -1 --format='%h %s')\`"
              echo "- 下次自动触发: 明天 11:10（WorkBuddy 定时任务）"
            else
              echo "- 结果: 数据无变化（平台暂无新工作流）"
            fi
            echo ""
            echo "> 数据已提交，下方 deploy-site job 将自动把本次更新部署到 GitHub Pages（约 1~2 分钟生效）。"
          } >> "$GITHUB_STEP_SUMMARY"

  # 注意：本 workflow 的提交使用 GITHUB_TOKEN，按 GitHub 规则不会触发其他 workflow，
  # 因此在这里内联部署，数据更新后立即上线。
  build-site:
    needs: update
    if: needs.update.outputs.CHANGED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate data
        run: python3 scripts/validate.py data/modules.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-site:
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
