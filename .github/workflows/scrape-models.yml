name: Scrape Models (auto-expand)

on:
  schedule:
    # 每周一 02:10 UTC ≈ 北京时间 10:10，避开 11:10 数据更新 / 12:10 链接检查
    - cron: "10 2 * * 1"
  workflow_dispatch:
    inputs:
      max_entries:
        description: "本次新增条目上限"
        required: false
        default: "300"
      target_per_type:
        description: "每个类型的目标条目数（按平台源计，已达标类型自动跳过）"
        required: false
        default: "50"
      pages:
        description: "Civitai/ModelScope 每类型翻页数（全量抓取时调大，如 5）"
        required: false
        default: "1"
      platforms:
        description: "抓取平台（逗号分隔：hf,civitai,modelscope）"
        required: false
        default: "hf,civitai,modelscope"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape & expand
        run: |
          python scripts/scrape_models.py \
            --max "${{ github.event.inputs.max_entries || '300' }}" \
            --target-per-type "${{ github.event.inputs.target_per_type || '50' }}" \
            --pages "${{ github.event.inputs.pages || '1' }}" \
            --platforms "${{ github.event.inputs.platforms || 'hf,civitai,modelscope' }}"

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet data/modules.json; then
            echo "无新增，跳过提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/modules.json
          git commit -m "[auto] scrape models: 扩充模块索引模型条目"
          git push
          echo "CHANGED=true" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN 的提交不会触发其他 workflow，数据提交后在此内联部署上线
  build-site:
    needs: scrape
    if: needs.scrape.outputs.CHANGED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate data
        run: python3 scripts/validate.py data/modules.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy-site:
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
