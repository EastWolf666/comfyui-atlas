name: Scrape Models (auto-expand)

on:
  schedule:
    # 每周一 02:10 UTC ≈ 北京时间 10:10，避开 11:10 数据更新 / 12:10 链接检查
    - cron: "10 2 * * 1"
  workflow_dispatch:
    inputs:
      max_entries:
        description: "本次新增条目上限"
        required: false
        default: "50"
      platforms:
        description: "抓取平台（逗号分隔：hf,civitai,modelscope）"
        required: false
        default: "hf,civitai,modelscope"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: "3.11"

      - name: Scrape & expand
        run: |
          python scripts/scrape_models.py \
            --max "${{ github.event.inputs.max_entries || '50' }}" \
            --platforms "${{ github.event.inputs.platforms || 'hf,civitai,modelscope' }}"

      - name: Commit if changed
        run: |
          if git diff --quiet data/modules.json; then
            echo "无新增，跳过提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/modules.json
          git commit -m "[auto] scrape models: 扩充模块索引模型条目"
          git push
